

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ofertas Shopee | Minha Vitrine</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#fff;font-family:Arial,sans-serif}
header{background:#050505;text-align:center;padding:24px 14px;border-bottom:3px solid #ff6500}
header h1{margin:0;color:#ff7200;font-size:30px}
header p{margin:10px 0 0;color:#eee}
.banner{padding:24px 15px;text-align:center;background:linear-gradient(120deg,#261006,#111,#40200a)}
.banner h2{margin:0 0 10px;font-size:25px}
.banner span{color:#ff7200}
.controls{max-width:1100px;margin:18px auto;padding:0 12px;display:flex;gap:10px;flex-wrap:wrap}
input,select{padding:13px;border-radius:8px;border:1px solid #ff7200;background:#202020;color:white;font-size:16px;flex:1;min-width:150px}
.categories{text-align:center;padding:5px 12px 18px}
.categories button,.pages button{background:#252525;color:#fff;border:1px solid #ff7200;border-radius:8px;padding:10px 14px;margin:4px;cursor:pointer}
.categories button.active,.pages button.active{background:#ff6500;color:#111;font-weight:bold}
main{max-width:1100px;margin:auto;padding:0 12px 25px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.card{background:#fff;color:#222;border:2px solid #ff6500;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card .info{padding:12px;display:flex;flex-direction:column;flex:1}
.number{font-size:12px;color:#9b4100;font-weight:bold}
.card h3{font-size:16px;line-height:1.35;margin:7px 0}
.card p{font-size:13px;color:#555;margin:0 0 10px}
.photo-area{order:2;padding:0 12px 12px}
.photo-area img{display:block;width:100%;height:190px;object-fit:contain;background:#f6f6f6;border-radius:8px}
.photo-area .missing{display:none;text-align:center;color:#666;font-size:12px;padding:12px}
.buy{display:block;text-align:center;background:#ff6500;color:#111;text-decoration:none;font-weight:bold;padding:12px;border-radius:8px;margin-top:auto}
.buy:hover{background:#ff8a38}
.pages{text-align:center;padding:20px 0}
.pages button:disabled{opacity:.35;cursor:not-allowed}
.empty{text-align:center;padding:25px;color:#ddd;grid-column:1/-1}
footer{background:#050505;border-top:2px solid #ff6500;text-align:center;padding:22px 12px;color:#ddd}
footer a{color:#ff7a19;margin:5px;display:inline-block}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.photo-area img{height:220px}}
@media(min-width:950px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>

<header>
  <h1>🛍️ MINHA VITRINE</h1>
  <p>Ofertas, novidades e achadinhos da Shopee</p>
</header>

<section class="banner">
  <h2>Encontre seu próximo <span>achadinho!</span></h2>
  <p>Veja as fotos dos produtos e clique para conferir na Shopee.</p>
</section>

<div class="controls">
  <input id="search" type="search" placeholder="🔎 Buscar produto..." aria-label="Buscar produto">
  <select id="category" aria-label="Filtrar categoria">
    <option value="">Todas as categorias</option>
    <option value="Casa">Casa</option>
    <option value="Cozinha">Cozinha</option>
    <option value="Ferramentas">Ferramentas</option>
    <option value="Moda">Moda</option>
    <option value="Acessórios">Acessórios</option>
    <option value="Outros">Outros</option>
  </select>
</div>

<div class="categories">
  <button class="active" data-cat="">Todos</button>
  <button data-cat="Casa">🏠 Casa</button>
  <button data-cat="Cozinha">🍳 Cozinha</button>
  <button data-cat="Ferramentas">🛠️ Ferramentas</button>
  <button data-cat="Moda">👗 Moda</button>
  <button data-cat="Acessórios">✨ Acessórios</button>
</div>

<main>
  <h2 id="pageTitle">Página 1 — Produtos 1 a 10</h2>
  <div class="grid" id="products"></div>
  <div class="pages">
    <button id="prev">❮ Anterior</button>
    <span id="pageNumbers"></span>
    <button id="next">Próxima ❯</button>
  </div>
</main>

<footer>
  <h3>Obrigado pela visita!</h3>
  <p>Confira os produtos pelos links individuais.</p>
  <a href="https://wa.me/5511951315202" target="_blank" rel="noopener">WhatsApp</a>
  <!-- Troque os endereços abaixo pelos links dos seus perfis reais -->
  <a href="#" target="_blank" rel="noopener">Instagram</a>
  <a href="#" target="_blank" rel="noopener">Facebook</a>
  <a href="#" target="_blank" rel="noopener">TikTok</a>
</footer>

<script>
const products = [
  {n:1,name:"Kit Garrafa Térmica e Caneca GTA",cat:"Casa",url:"https://s.shopee.com.br/70Kp3PNtZL",img:"produto01.jpg"},
  {n:2,name:"Kit 10 Potes Herméticos de 850 ml",cat:"Cozinha",url:"https://s.shopee.com.br/qkBiGG3b9",img:"produto02.jpg"},
  {n:3,name:"Kit Manicure e Pedicure com 19 Peças",cat:"Acessórios",url:"https://s.shopee.com.br/9KijpyhLJ4",img:"produto03.jpg"},
  {n:4,name:"Mini Impressora Térmica Portátil",cat:"Acessórios",url:"https://s.shopee.com.br/8fT32x0tXn",img:"produto04.jpg"},
  {n:5,name:"Despertador Digital com LED",cat:"Casa",url:"https://s.shopee.com.br/2VsPhn6riD",img:"produto05.jpg"},
  {n:6,name:"Kit com 2 Banquetas",cat:"Casa",url:"https://s.shopee.com.br/2qVG6T8JR1",img:"produto06.jpg"},
  {n:7,name:"Mini Esmerilhadeira Elétrica",cat:"Ferramentas",url:"https://s.shopee.com.br/4fwuHuUVx0",img:"produto07.jpg"},
  {n:8,name:"Suporte para Celular de Moto ou Bicicleta",cat:"Acessórios",url:"https://s.shopee.com.br/3LRWhWXuCk",img:"produto08.jpg"},
  {n:9,name:"Relógio Feminino com Conjunto de Joias",cat:"Acessórios",url:"https://s.shopee.com.br/5fpRTwdOGc",img:"produto09.jpg"},
  {n:10,name:"Kit com 3 Tapetes para Banheiro",cat:"Casa",url:"https://s.shopee.com.br/8fT33XCka1",img:"produto10.jpg"},
  {n:11,name:"Lavadora de Alta Pressão Vonder",cat:"Casa",url:"https://s.shopee.com.br/8KqClZwuyE",img:"produto11.jpg"},
  {n:12,name:"Mini Limpador de Óculos",cat:"Acessórios",url:"https://s.shopee.com.br/70KpBQPS58",img:"produto12.jpg"},
  {n:13,name:"Poltrona Decorativa com Puff",cat:"Casa",url:"https://s.shopee.com.br/3qNnPi3wv4",img:"produto13.jpg"},
  {n:14,name:"Conjunto de Pratos e Xícaras",cat:"Cozinha",url:"https://s.shopee.com.br/3g4NDbhjYt",img:"produto14.jpg"},
  {n:15,name:"Formas de Alumínio para Bolo e Pudim",cat:"Cozinha",url:"https://s.shopee.com.br/1LgSRQezQc",img:"produto15.jpg"},
  {n:16,name:"Short Feminino com Cinto",cat:"Moda",url:"https://s.shopee.com.br/7ptwBR5gyc",img:"produto16.jpg"},
  {n:17,name:"Kit de Ferramentas Elétricas 5 em 1",cat:"Ferramentas",url:"https://s.shopee.com.br/5AtB0cDksJ",img:"produto17.jpg"},
  {n:18,name:"Processador Elétrico de Alimentos 3 L",cat:"Cozinha",url:"https://s.shopee.com.br/8V9cypTueD",img:"produto18.jpg"},
  {n:19,name:"Kit de Ferramentas Elétricas Amarelas",cat:"Ferramentas",url:"https://s.shopee.com.br/3Vkx299gwS",img:"produto19.jpg"},
  {n:20,name:"Jogo de Ferramentas com 37 Peças",cat:"Ferramentas",url:"https://s.shopee.com.br/9zyQmDqRhu",img:"produto20.jpg"}
];

let page=1;
const perPage=10;
const grid=document.getElementById("products");
const search=document.getElementById("search");
const category=document.getElementById("category");

function render(){
  const q=search.value.trim().toLowerCase();
  const cat=category.value;
  const filtered=products.filter(p=>
    p.name.toLowerCase().includes(q) && (!cat || p.cat===cat)
  );
  const totalPages=Math.max(1,Math.ceil(filtered.length/perPage));
  if(page>totalPages) page=totalPages;
  const visible=filtered.slice((page-1)*perPage,page*perPage);

  document.getElementById("pageTitle").textContent =
    q || cat ? "Resultados da busca" : `Página ${page} — Produtos ${(page-1)*10+1} a ${Math.min(page*10,20)}`;

  grid.innerHTML="";
  if(!visible.length){
    grid.innerHTML='<div class="empty">Nenhum produto encontrado. Tente outra busca.</div>';
  }

  visible.forEach(p=>{
    const card=document.createElement("article");
    card.className="card";
    card.innerHTML=`
      <div class="info">
        <span class="number">PRODUTO ${p.n} · ${p.cat}</span>
        <h3>${p.name}</h3>
        <p>Confira fotos, detalhes e preço na Shopee.</p>
        <a class="buy" href="${p.url}" target="_blank" rel="noopener noreferrer">Ver na Shopee ↗</a>
      </div>
      <div class="photo-area">
        <img src="imagens/${p.img}" alt="${p.name}" loading="lazy">
        <div class="missing">Coloque a foto original em imagens/${p.img}</div>
      </div>`;
    const img=card.querySelector("img");
    img.addEventListener("error",()=>{
      img.style.display="none";
      card.querySelector(".missing").style.display="block";
    });
    grid.appendChild(card);
  });

  document.getElementById("prev").disabled=page===1;
  document.getElementById("next").disabled=page===totalPages;
  document.getElementById("pageNumbers").textContent=` Página ${page} de ${totalPages} `;
  document.querySelectorAll(".categories button").forEach(b=>{
    b.classList.toggle("active",b.dataset.cat===cat);
  });
}

search.addEventListener("input",()=>{page=1;render()});
category.addEventListener("change",()=>{page=1;render()});
document.querySelectorAll(".categories button").forEach(b=>{
  b.addEventListener("click",()=>{
    category.value=b.dataset.cat;
    page=1;
    render();
  });
});
document.getElementById("prev").addEventListener("click",()=>{ifo(page>1){page--;render()}});
document.getElementById("next").addEventListener("click",()=>{
  const count=products.filter(p=>
    p.name.toLowerCase().includes(search.value.trim().toLowerCase()) &&
    (!category.value || p.cat===category.value)
  ).length;
  if(page<Math.ceil(count/perPage)){page++;render()}
});
render();
</script>
</body>
</html>
