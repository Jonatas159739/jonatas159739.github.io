

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>Ofertas do Jonatas</title>
<style>
:root {
  --orange: #ff5b08;
  --gold: #ff9b00;
  --bg: #080808;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: radial-gradient(ellipse at top, #241006, #080808 50%, #050505);
  color: white;
  font-family: Arial, Helvetica, sans-serif;
}
.wrap { max-width: 1400px; margin: auto; padding: 14px; }
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
  padding: 15px 0;
  border-bottom: 2px solid var(--orange);
}
h1 { font-size: clamp(28px, 5vw, 48px); margin: 0; }
h1 span, .accent { color: var(--orange); }
.social, .nav, .pages {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.social a, .nav a {
  color: white;
  text-decoration: none;
  padding: 10px;
}
.social a {
  border: 1px solid var(--orange);
  border-radius: 10px;
  background: #151515;
}
.nav { padding: 12px 0; }
.search {
  display: flex;
  gap: 8px;
  margin: 15px 0;
}
.search input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border-radius: 10px;
  font-size: 16px;
}
.btn, .buy {
  border: 0;
  border-radius: 10px;
  padding: 12px;
  color: white;
  font-weight: bold;
  background: linear-gradient(120deg, #ff9b00, #ff3d00);
  cursor: pointer;
}
.hero {
  padding: 25px;
  border: 1px solid var(--gold);
  border-radius: 20px;
  background: linear-gradient(120deg, #2b1004, #080808);
  margin-bottom: 20px;
}
.hero h2 { font-size: clamp(30px, 5vw, 55px); margin: 0; }
.hero p { color: #eee; }
.categories {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin: 15px 0;
}
.category {
  background: #15100c;
  border: 1px solid var(--orange);
  color: white;
  border-radius: 10px;
  padding: 12px 5px;
  cursor: pointer;
}
.category.active { background: var(--orange); }
.sectionhead {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.products {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 12px;
  margin-top: 15px;
}
.product {
  background: white;
  color: #111;
  border: 2px solid var(--orange);
  border-radius: 14px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.visual {
  height: 150px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f5f5f5;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 10px;
}
.visual img { width: 100%; height: 100%; object-fit: contain; }
.product h3 { font-size: 15px; flex: 1; }
.buy { text-align: center; text-decoration: none; }
.pages { margin: 20px 0; }
.pages button {
  padding: 10px 14px;
  border-radius: 8px;
  background: #151515;
  color: white;
  border: 1px solid var(--orange);
}
.pages button.active { background: var(--orange); color: black; }
.notice { text-align: center; color: #bbb; font-size: 12px; }
@media(max-width:900px) {
  .products { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media(max-width:560px) {
  .wrap { padding: 8px; }
  .products { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .visual { height: 115px; }
  .product { padding: 7px; }
  .product h3 { font-size: 13px; }
  .categories { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<div class="wrap" id="inicio">
<header>
  <div>
    <h1>Ofertas <span>do Jonatas</span></h1>
    <p>🛍️ Produtos e ofertas para você!</p>
  </div>
  <div class="social">
    <a href="https://wa.me/5511951315202" target="_blank">WhatsApp</a>
    <a href="https://www.instagram.com/" target="_blank">Instagram</a>
    <a href="https://www.facebook.com/" target="_blank">Facebook</a>
    <a href="https://www.tiktok.com/" target="_blank">TikTok</a>
  </div>
</header>
<nav class="nav">
  <a href="#inicio">Início</a>
  <a href="#categorias">Categorias</a>
  <a href="#produtos">Produtos</a>
</nav>
<form class="search" id="searchForm">
  <input id="searchInput" placeholder="🔎 Pesquise um produto..." aria-label="Pesquisar produtos">
  <button class="btn" type="submit">Buscar</button>
</form>
<section class="hero">
  <h2>Ofertas <span class="accent">Imperdíveis!</span></h2>
  <p>Confira os produtos e clique para abrir o anúncio correto na Shopee.</p>
</section>
<section class="categories" id="categorias">
  <button class="category active" data-cat="todos">Todos</button>
  <button class="category" data-cat="casa">Casa e cozinha</button>
  <button class="category" data-cat="beleza">Beleza</button>
  <button class="category" data-cat="eletronicos">Eletrônicos</button>
  <button class="category" data-cat="ferramentas">Ferramentas</button>
  <button class="category" data-cat="moda">Moda</button>
  <button class="category" data-cat="acessorios">Acessórios</button>
  <button class="category" data-cat="outros">Outros</button>
</section>
<section id="produtos">
  <div class="sectionhead">
    <h2>🛒 Nossos <span class="accent">Produtos</span></h2>
    <span id="pageBadge">Página 1 de 2</span>
  </div>
  <div class="products" id="productGrid"></div>
  <div class="pages" id="pagination"></div>
</section> 
  
<script>
const products = [
  {name:"Kit Garrafa Térmica e Caneca GTA",url:"https://s.shopee.com.br/70Kp3PNtZL",cat:"casa"},
  {name:"Kit 10 Potes Herméticos de 850 ml",url:"https://s.shopee.com.br/qkBiGG3b9",cat:"casa"},
  {name:"Kit Manicure e Pedicure com 19 Peças",url:"https://s.shopee.com.br/9KijpyhLJ4",cat:"beleza"},
  {name:"Mini Impressora Térmica Portátil",url:"https://s.shopee.com.br/8fT32x0tXn",cat:"eletronicos"},
  {name:"Despertador Digital com LED",url:"https://s.shopee.com.br/2VsPhn6riD",cat:"eletronicos"},
  {name:"Kit com 2 Banquetas",url:"https://s.shopee.com.br/2qVG6T8JR1",cat:"casa"},
  {name:"Mini Esmerilhadeira Elétrica",url:"https://s.shopee.com.br/4fwuHuUVx0",cat:"ferramentas"},
  {name:"Suporte para Celular de Moto ou Bicicleta",url:"https://s.shopee.com.br/3LRWhWXuCk",cat:"acessorios"},
  {name:"Relógio Feminino com Conjunto de Joias",url:"https://s.shopee.com.br/5fpRTwdOGc",cat:"moda"},
  {name:"Kit 3 Tapetes para Banheiro",url:"https://s.shopee.com.br/8fT33XCka1",cat:"casa"},
  {name:"Lavadora de Alta Pressão Vonder",url:"https://s.shopee.com.br/8KqClZwuyE",cat:"ferramentas"},
  {name:"Mini Limpador de Óculos",url:"https://s.shopee.com.br/70KpBQPS58",cat:"acessorios"},
  {name:"Poltrona Decorativa com Puff",url:"https://s.shopee.com.br/3qNnPi3wv4",cat:"casa"},
  {name:"Conjunto de Pratos e Xícaras",url:"https://s.shopee.com.br/3g4NDbhjYt",cat:"casa"},
  {name:"Formas de Alumínio para Bolo e Pudim",url:"https://s.shopee.com.br/1LgSRQezQc",cat:"casa"},
  {name:"Short Feminino de Alfaiataria com Cinto",url:"https://s.shopee.com.br/7ptwBR5gyc",cat:"moda"},
  {name:"Kit Ferramentas Elétricas 5 em 1 Azul e Preto",url:"https://s.shopee.com.br/5AtB0cDksJ",cat:"ferramentas"},
  {name:"Processador Elétrico de Alimentos 3L",url:"https://s.shopee.com.br/8V9cypTueD",cat:"casa"},
  {name:"Kit Ferramentas Elétricas Amarelas",url:"https://s.shopee.com.br/3Vkx299gwS",cat:"ferramentas"},
  {name:"Jogo de Ferramentas com 37 Peças",url:"https://s.shopee.com.br/9zyQmDqRhu",cat:"ferramentas"}
];
</script>


<script>
const grid = document.getElementById("productGrid");
const pagination = document.getElementById("pagination");
const searchInput = document.getElementById("searchInput");
const pageBadge = document.getElementById("pageBadge");
let currentPage = 1;
let activeCategory = "todos";

function filteredProducts() {
  const term = searchInput.value.trim().toLowerCase();
  return products.filter(p =>
    p.name.toLowerCase().includes(term) &&
    (activeCategory === "todos" || p.cat === activeCategory)
  );
}

function render() {
  const filtered = filteredProducts();
  const totalPages = Math.max(1, Math.ceil(filtered.length / 10));
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * 10;
  const shown = filtered.slice(start, start + 10);

  grid.innerHTML = shown.map(p => `
    <article class="product">
      <div class="visual">
        <span style="font-size:42px">🛍️</span>
      </div>
      <h3>${p.name}</h3>
      <a class="buy" href="${p.url}" target="_blank" rel="noopener">
        Comprar na Shopee
      </a>
    </article>
  `).join("");

  pageBadge.textContent = `Página ${currentPage} de ${totalPages}`;
  pagination.innerHTML = "";

  for (let i = 1; i <= totalPages; i++) {
    const button = document.createElement("button");
    button.textContent = i;
    if (i === currentPage) button.classList.add("active");
    button.addEventListener("click", () => {
      currentPage = i;
      render();
    });
    pagination.appendChild(button);
  }

  if (!shown.length) {
    grid.innerHTML = "<p>Nenhum produto encontrado.</p>";
  }
}

document.getElementById("searchForm").addEventListener("submit", event => {
  event.preventDefault();
  currentPage = 1;
  render();
});

searchInput.addEventListener("input", () => {
  currentPage = 1;
  render();
});

document.querySelectorAll(".category").forEach(button => {
  button.addEventListener("click", () => {
    activeCategory = button.dataset.cat;
    currentPage = 1;
    document.querySelectorAll(".category").forEach(b =>
      b.classList.toggle("active", b === button)
    );
    render();
  });
});

render();
</script>
</body>
</html>
