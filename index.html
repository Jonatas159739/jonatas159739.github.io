<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<title>Achadinhos do Jonatas | Ofertas na Shopee</title>

<style>
:root {
  --orange: #ff6b00;
  --gold: #ffae36;
  --bg: #0b0b0d;
  --panel: #171719;
  --line: #2d2d31;
  --muted: #aaaab2;
  --white: #fff;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--white);
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 35px 15px;
  background: linear-gradient(135deg, #111, #291306);
  border-bottom: 2px solid var(--orange);
}

h1 {
  color: var(--gold);
  text-shadow: 0 0 15px #ff6b00;
}

header p {
  color: var(--muted);
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.search {
  width: 100%;
  padding: 14px;
  border: 1px solid var(--orange);
  border-radius: 12px;
  background: var(--panel);
  color: white;
  font-size: 16px;
}

.products {
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(145px, 1fr));
  gap: 16px;
  margin-top: 24px;
}

.product {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  text-align: center;
}

.product h3 {
  font-size: 15px;
}

.buy {
  display: block;
  padding: 12px 8px;
  margin-top: 12px;
  border-radius: 9px;
  background: linear-gradient(90deg,
    var(--orange), var(--gold));
  color: #111;
  text-decoration: none;
  font-weight: bold;
}

.social {
  display: inline-block;
  margin: 8px;
  padding: 12px 16px;
  border: 1px solid var(--orange);
  border-radius: 10px;
  color: white;
  text-decoration: none;
}

footer {
  text-align: center;
  padding: 25px;
  color: var(--muted);
}
</style>
</head>
<body>

<header>
  <h1>🔥 ACHADINHOS DO JONATAS 🔥</h1>
  <p>Ofertas especiais para você economizar!</p>
</header>

<main class="container">
  <input
    class="search"
    id="search"
    placeholder="🔎 Pesquisar produtos..."
  >

  <section class="products" id="products"></section>

  <footer>
    <p>Achadinhos do Jonatas</p>
    <a class="social"
       href="https://wa.me/5511951315202">
       Fale comigo no WhatsApp
    </a>
  </footer>
</main>

<script>
const produtos = [
  ["Kit garrafa térmica e caneca GTA",
   "https://s.shopee.com.br/70Kp3PNtZL"],
  ["Kit 10 potes herméticos",
   "https://s.shopee.com.br/qkBiGG3b9"],
  ["Kit manicure com 19 peças",
   "https://s.shopee.com.br/9KijpyhLJ4"],
  ["Mini impressora térmica",
   "https://s.shopee.com.br/8fT32x0tXn"],
  ["Despertador digital LED",
   "https://s.shopee.com.br/2VsPhn6riD"],
  ["Kit com 2 banquetas",
   "https://s.shopee.com.br/2qVG6T8JR1"],
  ["Mini esmerilhadeira elétrica",
   "https://s.shopee.com.br/4fwuHuUVx0"],
  ["Suporte para celular de moto",
   "https://s.shopee.com.br/3LRWhWXuCk"],
  ["Relógio feminino com joias",
   "https://s.shopee.com.br/5fpRTwdOGc"],
  ["Kit 3 tapetes para banheiro",
   "https://s.shopee.com.br/8fT33XCka1"],
  ["Lavadora de alta pressão Vonder",
   "https://s.shopee.com.br/8KqClZwuyE"],
  ["Mini limpador de óculos",
   "https://s.shopee.com.br/70KpBQPS58"],
  ["Poltrona decorativa com puff",
   "https://s.shopee.com.br/3qNnPi3wv4"],
  ["Conjunto de pratos e xícaras",
   "https://s.shopee.com.br/3g4NDbhjYt"],
  ["Formas de alumínio para bolo",
   "https://s.shopee.com.br/1LgSRQezQc"],
  ["Short feminino com cinto",
   "https://s.shopee.com.br/7ptwBR5gyc"],
  ["Kit ferramentas elétricas azul",
   "https://s.shopee.com.br/5AtB0cDksJ"],
  ["Processador elétrico 3 litros",
   "https://s.shopee.com.br/8V9cypTueD"],
  ["Kit ferramentas elétricas amarelas",
   "https://s.shopee.com.br/3Vkx299gwS"],
  ["Jogo de ferramentas 37 peças",
   "https://s.shopee.com.br/9zyQmDqRhu"]
];

function mostrar(lista) {
  document.getElementById("products").innerHTML =
    lista.map(([nome, link]) => `
      <article class="product">
        <h3>${nome}</h3>
        <a class="buy"
           href="${link}"
           target="_blank"
           rel="noopener">
           🛒 Ver na Shopee
        </a>
      </article>
    `).join("");
}

mostrar(produtos);

document.getElementById("search")
  .addEventListener("input", function() {
    const termo = this.value.toLowerCase();
    mostrar(produtos.filter(p =>
      p[0].toLowerCase().includes(termo)
    ));
  });
</script>

</body>
</html>
